<style>
/* ── charts ───────────────────────────────── */
.maps{display:grid;grid-template-columns:1.35fr 1fr;gap:1px;background:var(--line)}
@media(max-width:900px){.maps{grid-template-columns:1fr}}
.map{background:var(--surface);padding:20px 22px 16px;min-width:0}
.map h3{font-size:14px;font-weight:600;margin-bottom:3px}
.map .cap{font-size:12.5px;color:var(--ink-2);margin:0 0 14px;line-height:1.5}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12px;color:var(--ink-2)}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:-1px}
.legend .ln{width:16px;height:0;border-top:1.5px dashed var(--ink-3);border-radius:0;margin-right:6px;
  display:inline-block;vertical-align:3px}
svg{display:block;width:100%;height:auto;overflow:visible}
.gridline{stroke:var(--line);stroke-width:1}
.axline{stroke:var(--line-2);stroke-width:1}
.axtext{fill:var(--ink-3);font-family:var(--mono);font-size:10px}
.axtitle{fill:var(--ink-2);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em}
.peg{stroke:var(--ink-3);stroke-width:1.2;stroke-dasharray:4 4;fill:none;opacity:.62}
.peglab{fill:var(--ink-3);font-family:var(--mono);font-size:10px}
.dot{stroke:var(--surface);stroke-width:2;cursor:pointer;transition:r .12s}
.dot:hover{stroke:var(--ink);stroke-width:2}
.sbar{cursor:pointer}
.sbar rect{transition:opacity .12s}
.sbar:hover rect{opacity:.72}
.sbarlab{fill:var(--ink-2);font-family:var(--body);font-size:11.5px}
.sbarval{fill:var(--ink-2);font-family:var(--mono);font-size:11px;font-weight:500}
#tip{
  position:fixed;z-index:60;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);
  padding:9px 12px;font-size:12.5px;max-width:250px;line-height:1.5;
}
#tip .tn{font-weight:700;font-family:var(--disp);margin-bottom:3px}
#tip .tr{display:flex;justify-content:space-between;gap:16px;color:var(--ink-2)}
#tip .tr b{font-family:var(--mono);color:var(--ink);font-weight:500}

/* ── controls ─────────────────────────────── */
/* Deliberately NOT sticky: the table below is its own scroll pane with a pinned
   header, and a sticky bar here would overlay that header once the pane's top
   passed under it. The pane is sized to leave this bar on screen instead. */
.controls{
  background:var(--bg);border-bottom:1px solid var(--line);padding:12px 0;margin-top:44px;
  display:flex;flex-wrap:wrap;gap:9px;align-items:center;
}
.controls input[type=search],.controls select{
  font-family:var(--body);font-size:13px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-2);border-radius:2px;padding:7px 10px;
}
.controls input[type=search]{min-width:190px;flex:0 1 220px}
.controls select{cursor:pointer}
.controls :focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:flex;border:1px solid var(--line-2);border-radius:2px;overflow:hidden}
.seg button{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;padding:7px 12px;
  background:var(--surface);color:var(--ink-2);border:0;cursor:pointer;
  border-right:1px solid var(--line-2);
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);cursor:pointer;
  padding:6px 8px;border:1px solid transparent}
.chk input{accent-color:var(--accent);cursor:pointer}
.count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap}

/* ── table ────────────────────────────────── */
/* overflow-x:auto makes this the sticky containing block for thead, so a viewport
   offset would strand the header mid-table. Make it a real scroll pane instead:
   the header then pins to the pane's own top edge. */
.tablewrap{overflow:auto;border:1px solid var(--line);border-top:0;background:var(--surface);
  max-height:max(430px,calc(100vh - var(--ctrlh,64px) - 34px));overscroll-behavior:contain}
table{border-collapse:collapse;width:100%;min-width:1180px}
thead th{
  position:sticky;top:0;z-index:20;background:var(--surface-2);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-2);font-weight:500;text-align:right;padding:10px 11px;white-space:nowrap;
  border-bottom:1px solid var(--line-2);cursor:pointer;user-select:none;
}
thead th:first-child,thead th.l{text-align:left}
thead th:hover{color:var(--accent)}
thead th .ar{opacity:0;font-size:9px;margin-left:3px}
thead th[data-dir] .ar{opacity:1;color:var(--accent)}
tbody td{padding:9px 11px;text-align:right;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody td.l{text-align:left;font-family:var(--body)}
tbody tr.row{cursor:pointer}
tbody tr.row:hover>td{background:var(--surface-2)}
tbody tr.row.open>td{background:var(--surface-2)}
td.stripe{padding:0;width:3px;min-width:3px}
.nm{font-weight:500;font-size:14px}
.tk{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.02em}
.mk{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--ink-3);
  border:1px solid var(--line-2);padding:1px 4px;margin-left:5px;vertical-align:1px}
.sect{font-size:12.5px;color:var(--ink-2)}
.fixmark{color:var(--accent);font-size:10px;margin-left:3px;cursor:help}
.chg{font-size:11px;display:block;line-height:1.3}
.chg.u{color:var(--up)} .chg.d{color:var(--down)}
.pill{font-family:var(--body);font-size:11.5px;padding:2px 8px;white-space:nowrap;
  border:1px solid;border-radius:1px;font-weight:500}
.r-cheap2{color:var(--cheap);border-color:var(--cheap);background:var(--cheap-soft)}
.r-cheap1{color:var(--cheap);border-color:var(--line-2);background:var(--cheap-soft)}
.r-fair  {color:var(--ink-2);border-color:var(--line-2);background:var(--mid-soft)}
.r-rich1 {color:var(--rich);border-color:var(--line-2);background:var(--rich-soft)}
.r-rich2 {color:var(--rich);border-color:var(--rich);background:var(--rich-soft)}
.r-flag  {color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.r-none  {color:var(--ink-3);border-color:var(--line-2);background:transparent}
.upcell{position:relative;min-width:112px}
.upbar{position:absolute;top:50%;transform:translateY(-50%);height:15px;opacity:.2}
.upv{position:relative;font-weight:600}
.upv.c{color:var(--cheap)} .upv.r{color:var(--rich)}
.stale{color:var(--warn);font-size:10px;margin-left:4px}
.subv{display:block;font-size:10.5px;color:var(--ink-3);line-height:1.35}
</style>
