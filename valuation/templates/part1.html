<title>台股財測評價台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#EDEFF3; --surface-3:#E3E7ED;
  --ink:#161A21; --ink-2:#5A6472; --ink-3:#868F9D;
  --line:#DCE1E8; --line-2:#C6CED8;
  --cheap:#1C6FD0; --rich:#C4581F; --mid:#8A8F98;
  --cheap-soft:#E4EDFA; --rich-soft:#FAEBE1; --mid-soft:#EDEFF2;
  --up:#D0342C; --down:#1F8A5B;
  --accent:#8A6A1C; --accent-soft:#F2EBD9;
  --warn:#9A6B12; --warn-soft:#F7EEDC;
  --shadow:0 1px 2px rgba(20,28,40,.07),0 4px 14px rgba(20,28,40,.05);
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:'Archivo','Noto Sans TC',system-ui,sans-serif;
  --body:'Noto Sans TC','Archivo',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1319; --surface:#161B23; --surface-2:#1D242E; --surface-3:#263040;
    --ink:#E7ECF3; --ink-2:#98A4B5; --ink-3:#6C7889;
    --line:#28313E; --line-2:#38434F;
    --cheap:#4A90DE; --rich:#D26E30; --mid:#8E97A6;
    --cheap-soft:#16273D; --rich-soft:#331F12; --mid-soft:#1F262F;
    --up:#FF5F52; --down:#33BE85;
    --accent:#C9A24A; --accent-soft:#2A2415;
    --warn:#D6A542; --warn-soft:#2B2314;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1319; --surface:#161B23; --surface-2:#1D242E; --surface-3:#263040;
  --ink:#E7ECF3; --ink-2:#98A4B5; --ink-3:#6C7889;
  --line:#28313E; --line-2:#38434F;
  --cheap:#4A90DE; --rich:#D26E30; --mid:#8E97A6;
  --cheap-soft:#16273D; --rich-soft:#331F12; --mid-soft:#1F262F;
  --up:#FF5F52; --down:#33BE85;
  --accent:#C9A24A; --accent-soft:#2A2415;
  --warn:#D6A542; --warn-soft:#2B2314;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1360px;margin:0 auto;padding:0 24px 96px}
h1,h2,h3{font-family:var(--disp);text-wrap:balance;margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;
}

/* ── masthead ─────────────────────────────── */
.mast{padding:52px 0 30px;border-bottom:1px solid var(--line)}
.mast-top{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between}
.mast h1{font-size:clamp(30px,4.6vw,46px);font-weight:700;letter-spacing:-.022em;line-height:1.08}
.mast .sub{color:var(--ink-2);max-width:60ch;margin-top:14px;font-size:15px}
.mast .sub b{color:var(--ink);font-weight:500}
.mast-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sitenav{display:flex;gap:2px}
.sitenav a{
  font-size:12.5px;color:var(--ink-2);text-decoration:none;padding:8px 12px;
  border:1px solid var(--line-2);border-radius:2px;background:var(--surface);white-space:nowrap;
}
.sitenav a:hover{border-color:var(--accent);color:var(--accent)}
.sitenav a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.themebtn{
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  background:var(--surface);color:var(--ink-2);border:1px solid var(--line-2);
  border-radius:2px;padding:8px 14px;cursor:pointer;white-space:nowrap;
}
.themebtn:hover{border-color:var(--accent);color:var(--accent)}

/* ── KPI strip ────────────────────────────── */
/* 6 cells; auto-fit can land on 4 or 5 columns and leave the leftover grid area
   showing as a line-coloured block, so use column counts that divide 6 exactly */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;
  background:var(--line);border:1px solid var(--line);margin-top:34px}
@media(max-width:1080px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:620px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);padding:16px 18px 15px;display:flex;flex-direction:column;gap:5px}
.kpi .v{font-family:var(--mono);font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1}
.kpi .l{font-size:12px;color:var(--ink-2);line-height:1.4}
.kpi .n{font-size:11px;color:var(--ink-3);font-family:var(--mono)}

/* ── generic panel ────────────────────────── */
.panel{background:var(--surface);border:1px solid var(--line);margin-top:44px}
.panel-hd{padding:18px 22px;border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
.panel-hd h2{font-size:17px;font-weight:600;letter-spacing:-.008em}
.panel-hd p{margin:0;font-size:13px;color:var(--ink-2);max-width:62ch}
.panel-bd{padding:22px}

/* ── method disclosure ────────────────────── */
details.method{margin-top:26px;background:var(--surface);border:1px solid var(--line)}
details.method>summary{
  padding:15px 22px;cursor:pointer;font-family:var(--disp);font-weight:600;font-size:14px;
  display:flex;align-items:center;gap:10px;list-style:none;
}
details.method>summary::-webkit-details-marker{display:none}
details.method>summary::before{content:"＋";font-family:var(--mono);color:var(--accent);font-size:15px}
details.method[open]>summary::before{content:"−"}
details.method>summary:hover{color:var(--accent)}
.method-bd{padding:4px 22px 26px;border-top:1px solid var(--line)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);margin:20px 0}
.step{background:var(--surface);padding:15px 16px}
.step .k{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.1em;
  text-transform:uppercase;display:block;margin-bottom:7px}
.step .t{font-weight:500;font-size:14px;margin-bottom:5px}
.step .d{font-size:13px;color:var(--ink-2);line-height:1.55}
.formula{font-family:var(--mono);font-size:13px;background:var(--surface-2);
  border-left:2px solid var(--accent);padding:13px 16px;margin:18px 0;overflow-x:auto;white-space:nowrap}
.caveat{border:1px solid var(--warn);background:var(--warn-soft);padding:14px 16px;
  font-size:13px;color:var(--ink);margin-top:20px}
.caveat b{color:var(--warn)}
.method-bd p{font-size:14px;color:var(--ink-2);max-width:72ch}
.method-bd p b{color:var(--ink);font-weight:500}
</style>
