<!doctype html>
<html lang="zh-Hant">
<head>

  <title>台股 AI 排程研究報告</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6f8;
      --paper: #ffffff;
      --ink: #1d2430;
      --muted: #637083;
      --line: #dce2ea;
      --accent: #0f6b5f;
      --accent-2: #1d4f91;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      line-height: 1.6;
    }
    main {
      width: min(920px, calc(100% - 28px));
      margin: 0 auto;
      padding: 44px 0 56px;
    }
    header, section {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: clamp(22px, 4vw, 36px);
      margin-bottom: 16px;
    }
    header { border-top: 6px solid var(--accent); }
    h1, h2 { margin: 0 0 12px; line-height: 1.2; }
    h1 { font-size: clamp(30px, 5vw, 48px); }
    h2 { font-size: 22px; }
    p { margin: 0; color: var(--muted); }
    a {
      color: var(--accent-2);
      text-decoration: none;
      border-bottom: 1px solid rgba(29, 79, 145, .25);
    }
    .report {
      display: grid;
      gap: 10px;
      padding: 16px 0;
      border-top: 1px solid var(--line);
    }
    .report:first-of-type { border-top: 0; padding-top: 0; }
    .title { font-weight: 800; font-size: 19px; }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 9px;
      background: #fbfcfd;
    }
    .note { font-size: 13px; }
  </style>
</head>
<body>
